[package]
name = "jui"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A CLI and TUI client for Jira Data Center"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "jui"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "sync", "time", "process", "fs", "signal", "io-std", "io-util"] }
reqwest = { version = "0.13", default-features = false, features = ["default-tls", "http2", "system-proxy", "charset", "json", "multipart", "query"] }
clap = { version = "4.6", features = ["derive", "env", "wrap_help"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
toml_edit = "0.25"
etcetera = "0.11"
thiserror = "2"
color-eyre = "0.6"
comfy-table = "8"
owo-colors = { version = "4", features = ["supports-colors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2"
open = "5"
amdc = { package = "atlassian-markdown-converter", version = "=0.2.1" }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "layout-cache"] }
crossterm = { version = "0.29", features = ["event-stream"] }
tokio-util = "0.7"
futures = { version = "0.3", default-features = false, features = ["std", "async-await"] }
unicode-width = "0.2"
tempfile = "3"
similar = "2"
clap_complete = "4"

[dev-dependencies]
wiremock = "0.6"
assert_cmd = "2"
insta = { version = "1", features = ["json"] }
predicates = "3"
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
